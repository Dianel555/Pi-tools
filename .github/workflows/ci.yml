name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.19.0
          cache: npm
      - name: Install Tkinter for Python tests
        run: sudo apt-get update && sudo apt-get install -y python3-tk
      - run: npm ci
      - run: npm run check
